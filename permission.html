<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Enable camera</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 460px;
        margin: 60px auto;
        line-height: 1.6;
        color: #222;
      }
      button {
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
      }
      #msg {
        margin-top: 16px;
        font-size: 14px;
        color: #555;
      }
      .err {
        color: #b00;
      }
    </style>
  </head>
  <body>
    <h2>Enable camera</h2>
    <p>
      Reading Assistant uses your camera to see which lines you have read.
      The video never leaves your computer.
    </p>
    <p><b>Close Teams, Zoom or any other camera app first.</b></p>

    <button id="enable">Allow camera</button>
    <div id="msg"></div>

    <script src="dist/permission.js"></script>
  </body>
</html>

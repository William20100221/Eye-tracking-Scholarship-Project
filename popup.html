<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 250px;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      h3 { margin: 0 0 10px; font-size: 15px; }
      button {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 6px;
      }
      #dotBtn { background: #f2f2f2; }
      #dotBtn.on { background: #ffe0e0; }
      hr { border: 0; border-top: 1px solid #e5e5e5; margin: 10px 0; }
      #status { margin-top: 8px; font-size: 12px; color: #555; }
      #calib { font-size: 12px; color: #777; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h3>Reading Assistant</h3>

    <button id="enable">Enable eye tracking</button>
    <button id="dotBtn">Gaze dot: on</button>

    <hr />

    <button id="calibrate">Calibrate</button>
    <button id="debug">Face view</button>

    <div id="status">Camera is off.</div>
    <div id="calib"></div>

    <script src="dist/popup.js"></script>
  </body>
</html>
